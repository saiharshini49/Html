<!DOCTYPE html>
<html>

<head>
    <title>Form Practice</title>
</head>

<body>
    <form>
        <label>Full Name</label><br>
        <input type="text"><br>
        <label>Email</label><br>
        <input type="email"><br>
        <label>Password</label><br>
        <input type="password"><br>
        <label>phone</label><br>
        <input type="number"><br>
        <label>Address:</label>
        <input type="text"><br>
        <label>Gender:</label>
        <input type="radio">Male
        <input type="radio">Female
        <br>
        <label>Skills:</label>
        <input type="checkbox">html
        <input type="checkbox">CSS
        <input type="checkbox">JS
        <br>
        <label>College:</label>
        <select>
            <option>Sir CRReddy college of Engineering</option>
            <option>Ramchandra Engineering college</option>
            <option>Eluru Engineering College</option>
        </select>
        <button>Submit</button>
    </form>
</body>
</html>
